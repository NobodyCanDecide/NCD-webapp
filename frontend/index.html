<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Login</title>
	<link rel="stylesheet" href="login.css">
</head>
<script>
function LoginResponse(response) {
	var text = JSON.parse(response);
	document.getElementById("response").innerHTML = "response: " + text +"<p>";
}

function SendLoginRequest(user, password) {
	var req = new XMLHttpRequest();
	req.open("POST", "login.php", true);
	req.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
	
	req.onreadystatechange=function() {
		if ((this.readyState == 4) && (this.status == 200)) {
			LoginResponse(this.responseText);
		}
	}
	req.send("type=login&uname=" + user + "&pword=" + password);
}

</script>
<body>
	<h1>Login</h1>
	<div id="login_box">
	<form id=login_page">
		<label>Username</label> <input id="user" type="text"></input> <br>
		<label>Password</label> <input id="password" type="password"></input> <br>
		<button id="login" type="submit" onclick="validate()">LOG IN</button>
	<div id="response">
		awaiting response
	</div>
	</div>
	</form>	
<script>
const user = document.getElementById("user");
const pass = document.getElementById("password");
const button = document.getElementById("login");

// validate input before sending req
function validate() {
	
	SendLoginRequest($user,$pass);
}
</script>
</body>
</html>
