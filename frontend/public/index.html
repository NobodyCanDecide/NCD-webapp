<html>
<script>
function HandleLoginResponse(res) {
	var text = JSON.parse(res);
	document.getElementById("response").innerHTML = "response: " + text + "<p>";
}

function SendLoginRequest(username, password) {
	var req = new XMLHttpRequest();
	req.open("POST", "login.php", true);
	req.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
	req.onreadystatechange = function () {
		if ((this.readyState == 4) && (this.status == 200)) {
			HandleLoginResponse(this.response);
		}
	}
	req.send("type=login&uname=" + username + "&pword=" + password);
}
</script>
<head>
	<meta charset="UTF-8">
	<title>Login</title>
	<link rel="stylesheet" href="css/login.css">
</head>
<body>
	<h1>Login</h1>
	<div id="login_box">
	<!-- <form id="login_page" action="POST"> -->
		<label>Username</label>
		<input id="user" type="text"></input> <br>

		<label>Password</label> 
		<input id="password" type="password"></input> <br>
		
		<button id="login" type="submit" onclick="SendLoginRequest("alice","password123")">LOG IN</button>

		<div id="response">
			awaiting response
		</div>
	</div>
	<!-- </form> -->
</body>
</html>
