<html>
<script>
function HandleRegistrationResponse(res) {
	var text = JSON.parse(res);
	document.getElementbyId("response").innerHTML = "response: " + text.message + "<p>";
}

function SendRegistrationRequest(username, email, password) {
	var req = new XMLHttpRequest();
	req.open("POST", "registration.php", true);
	req.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
	req.onreadystatechange = function () {
		if ((this.readyState == 4) && (this.status == 200)) {
			HandleRegistrationResponse(this.responseText);
		}
	req.send("type=register&username="+username+"&email="+email+"&password="+password);
}
</script>
